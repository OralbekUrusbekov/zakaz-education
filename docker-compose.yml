services:
  db:
    image: postgres:16-alpine
    container_name: techschool-db
    environment:
      POSTGRES_USER: techschool
      POSTGRES_PASSWORD: techschool
      POSTGRES_DB: education
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techschool -d education"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: techschool-backend
    environment:
      DATABASE_URL: postgresql+psycopg://techschool:techschool@db:5432/education
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: http://localhost:3040,http://localhost:3000
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "8020:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        # адрес, по которому браузер пользователя достучится до API
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8020/api/v1}
    container_name: techschool-frontend
    ports:
      - "3040:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  uploads:
